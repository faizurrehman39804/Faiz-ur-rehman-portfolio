<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f541" />
      <stop offset="100%" stop-color="#00d4f5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f541" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#111216" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#252830" stroke-width="1.5" />
  
  <!-- Outer glowing accent corner -->
  <circle cx="52" cy="12" r="3" fill="#00f541" filter="url(#shadow)" />
  
  <!-- Monogram "FR" stylized -->
  <g filter="url(#shadow)">
    <!-- Letter F -->
    <path d="M16 18 H32 M16 18 V46 M16 31 H28" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Letter R -->
    <path d="M36 46 V31 M36 31 C36 24 48 24 48 31 C48 37 36 37 36 37 M43 37 L48 46" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
